<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">EasyDrive logo</title>
  <desc id="desc">An orange map pin with a white car above the EasyDrive wordmark.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb21b"/><stop offset="1" stop-color="#f39200"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17232b" flood-opacity=".12"/>
    </filter>
    <clipPath id="pinClip"><path d="M400 42c-72 0-130 57-130 128 0 87 130 204 130 204s130-117 130-204C530 99 472 42 400 42Z"/></clipPath>
  </defs>
  <g filter="url(#softShadow)">
    <path class="pin" d="M400 42c-72 0-130 57-130 128 0 87 130 204 130 204s130-117 130-204C530 99 472 42 400 42Z" fill="url(#orange)"/>
    <g class="car" fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 168l14-30c4-9 11-14 22-14h68c11 0 18 5 22 14l14 30" fill="none" stroke-width="8"/>
      <path d="M320 170c2-8 9-13 19-13h122c10 0 17 5 19 13l9 13c5 6 7 12 7 21v42c0 7-5 12-12 12h-11c-7 0-12-5-12-12v-8H339v8c0 7-5 12-12 12h-11c-7 0-12-5-12-12v-42c0-9 2-15 7-21Z" stroke="none"/>
      <path d="M340 188h120" stroke="#f7a20a" stroke-width="7"/>
      <path d="M324 184l-13-6c-6-3-7-10-2-14 4-3 9-2 13 0l14 9M476 184l13-6c6-3 7-10 2-14-4-3-9-2-13 0l-14 9" stroke-width="5" fill="#fff"/>
      <path d="M320 199l23 7c6 2 8 7 7 12l-1 3-23-5c-7-2-10-8-6-17ZM480 199l-23 7c-6 2-8 7-7 12l1 3 23-5c7-2 10-8 6-17Z" fill="#f7a20a" stroke="none"/>
      <rect x="360" y="214" width="80" height="7" rx="3.5" fill="#f7a20a" stroke="none"/>
    </g>
  </g>
  <g class="wordmark" font-family="Arial, Helvetica, sans-serif" font-weight="750" font-size="102" letter-spacing="-4">
    <text x="400" y="475" text-anchor="middle" fill="#17232b">Easy<tspan fill="url(#orange)">Drive</tspan></text>
  </g>
  <style>
    .pin { transform-origin: 400px 374px; animation: pin-arrive 1s cubic-bezier(.2,.8,.2,1) both; }
    .car { transform-origin: 400px 195px; animation: car-pop .8s .35s ease-out both; }
    .wordmark { transform-origin: 400px 450px; animation: word-reveal .9s .45s ease-out both; }
    .pin::after { content: none; }
    @keyframes pin-arrive { 0% { opacity:0; transform:translateY(-24px) scale(.86); } 65% { opacity:1; transform:translateY(4px) scale(1.025); } 100% { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes car-pop { from { opacity:0; transform:scale(.78); } to { opacity:1; transform:scale(1); } }
    @keyframes word-reveal { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; opacity:1 !important; } }
  </style>
</svg>
